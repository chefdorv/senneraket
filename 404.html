<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page introuvable — tekarennes.dooka.fr</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --border: #E4E0D6;
    --text: #15191F;
    --muted: #5F6672;
    --accent: #178A45;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171C;
      --surface: #1C2026;
      --border: #2C323A;
      --text: #F8F8F4;
      --muted: #8B95A1;
      --accent: #3FBE72;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }
  h1 { margin: 0 0 12px; font-size: 1.35rem; font-weight: 600; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }
  a { color: var(--accent); font-size: 0.9rem; }
</style>
</head>
<body>
  <main>
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas (ou pas encore).</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
