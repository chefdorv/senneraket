name: Publier le site

# Le site est construit ici puis déposé sur GitHub Pages, plutôt que d'être
# commité en fichiers dans le dépôt : la branche `main` ne contient donc que
# des sources, jamais de sortie de build.
#
# Pour que ça marche, le dépôt doit être réglé sur Settings > Pages > Source :
# « GitHub Actions » (et non « Deploy from a branch »).

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois. `cancel-in-progress: false` pour laisser
# terminer celui qui est déjà parti plutôt que de publier un site à moitié
# déposé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web
        env:
          # Place le site sur la semaine des données de démonstration. À
          # retirer en même temps que web/src/lib/fixtures.ts.
          DEMO_TODAY: '2026-06-27'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
